services:
  face-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: face-recognition-api
    ports:
      - "8000:8000"
    environment:
      # Security
      - API_TOKEN=${API_TOKEN}
      # Default Models
      - DET_MODEL_PATH=${DET_MODEL_PATH:-face_detection/scrfd_2.5g_bnkps.onnx}
      - REC_MODEL_PATH=${REC_MODEL_PATH:-face_recognition/arcface_r50_fp16.onnx}
      # Server Settings
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Thresholds
      - CONF_THRESHOLD=${CONF_THRESHOLD:-0.50}
      - IOU_THRESHOLD=${IOU_THRESHOLD:-0.40}
      - SIM_THRESHOLD=${SIM_THRESHOLD:-0.45}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
