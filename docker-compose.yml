services:
  face-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: face-recognition-api
    ports:
      - "8000:8000"
    environment:
      # Optional model path overrides (defaults are managed in models_config.json)
      # - DET_MODEL_PATH=face_detection/scrfd_10g.onnx
      # - REC_MODEL_PATH=face_recognition/arcface_r50_fp16.onnx
      # Security
      - API_TOKEN=${API_TOKEN}
      # Thresholds
      - CONF_THRESHOLD=0.50
      - IOU_THRESHOLD=0.40
      - SIM_THRESHOLD=0.45
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
